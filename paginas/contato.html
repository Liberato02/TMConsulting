<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Contato | TM Consulting</title>

    <link rel="stylesheet" href="../css/main.css" />
  </head>

  <body>
    <header class="header">
    <img class="header__logo" src="../img/TMconsulting.png" alt="logo">
      
      <nav class="navbar">
        <a class="navbar__link" href="../index.html">Home</a>

        <a class="navbar__link" href="../paginas/sobre.html">Sobre</a>

        <a class="navbar__link" href="../paginas/faq.html">FAQ</a>

        <a class="navbar__link" href="../paginas/integrantes.html">Integrantes</a>
      </nav>
    </header>

    <main>
      <section class="contact">
        <h2 class="contact__title">Entre em Contato</h2>

        <form class="contact__form">
          <div class="contact__group">
            <label class="contact__label" for="nome"> Nome </label>

            <input class="contact__input" type="text" id="nome" />
          </div>

          <div class="contact__group">
            <label class="contact__label" for="email"> Email </label>

            <input class="contact__input" type="email" id="email" />
          </div>

          <div class="contact__group">
            <label class="contact__label" for="mensagem"> Mensagem </label>

            <textarea class="contact__textarea" id="mensagem"></textarea>
          </div>

          <button class="contact__btn" type="submit">Enviar</button>
        </form>
      </section>
    </main>

    <footer class="footer">
      <p class="footer__text">TM Consulting © 2026</p>
    </footer>
  </body>
</html>
