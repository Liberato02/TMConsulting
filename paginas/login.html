<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Soul Game</title>

    <link rel="stylesheet" href="../css/main.css" />

    <script src="../Js/game.js" defer></script>
  </head>

  <body>
    <header class="header">
      <div class="header__brand">
        <img class="header__logo" src="../img/TMconsulting.png" alt="Logo">
        <span class="header__name">| Soul Game</span>
      </div>
        <nav class="navbar">
          <a class="navbar__link" href="../index.html">Home</a>
          <a class="navbar__link" href="./sobre.html">Sobre</a>
          <a class="navbar__link" href="./faq.html">FAQ</a>
          <a class="navbar__link" href="./contato.html">Contato</a>
          <a class="navbar__link" href="./integrantes.html">integrantes</a>
        </nav>
      
    </header>

    <main class="login">
      <section class="login__container">
        <h1 class="login__title">Login</h1>

        <p class="login__description">
          Digite seu email e senha para acessar sua conta.
        </p>

        <form class="login__form">
          <input
            id="email"
            class="login__input"
            type="email"
            placeholder="Digite seu email"
            required
          >

          <input
            id="senha"
            class="login__input"
            type="password"
            placeholder="Digite sua senha"
            required
          >

          <p id="mensagem" style="color: #ff4d4d; font-size: 14px; margin-top: 10px; font-weight: bold;"></p>

          <button
            id="btnEntrar"
            class="login__button"
            type="button"
          >
            Entrar
          </button>
        </form>
      </section>
    </main>
  </body>
</html>
