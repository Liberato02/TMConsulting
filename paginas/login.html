<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | Soul Game</title>

    <link rel="stylesheet" href="../css/main.css" />
  </head>

  <body>
    <!-- HEADER -->

    <header class="header">
      <div class="header__brand">

    <img class="header__logo" src="../img/TMconsulting.png" alt="Logo">

    <span class="header__name">
        | Soul Game
    </span>
    </div>
    </header>

    <!-- LOGIN -->

    <main class="login">
      <div class="login__box">
        <h1 class="login__title">Bem-vindo</h1>

        <p class="login__text">Faça login para continuar</p>

        <form class="login__form">
          <input
            class="login__input"
            type="email"
            placeholder="Digite seu email"
          />

          <input
            class="login__input"
            type="password"
            placeholder="Digite sua senha"
          />

          <button class="login__button" type="submit">Entrar</button>
        </form>
      </div>
    </main>

    <script src="../js/login.js"></script>
  </body>
</html>
